name: Package UOS amd64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  uos-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend
        run: npm ci

      - name: Build CompareW
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: CompareW v__VERSION__
          releaseBody: UOS / Debian amd64 安装包。
          releaseDraft: true
          includeRelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          includeUpdaterJson: false
          args: --bundles deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CompareW-uos-amd64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
